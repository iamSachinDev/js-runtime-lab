<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">JS Runtime Lab</title>
  <desc id="d">Animated banner: a call stack pushing and popping frames next to the Node.js event loop cycling through its phases.</desc>
  <defs>
    <radialGradient id="glowA" cx="82%" cy="18%" r="55%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="8%" cy="100%" r="60%"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce7fa" fill-opacity=".05"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="card"><rect width="1280" height="420" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .seg { fill: none; stroke: #22385f; stroke-width: 16; stroke-linecap: butt; }
    .lbl { fill: #8ea3c8; font-size: 12px; }
    .phase { fill: #22d3ee; font-size: 21px; font-weight: 600; opacity: 0; animation: phase 9s infinite; }
    @keyframes phase { 0%, 15.5% { opacity: 1; } 16.6%, 100% { opacity: 0; } }
    .spin-step { transform-origin: 1052px 212px; animation: spin 9s steps(6, end) infinite; }
    .spin { transform-origin: 1052px 212px; animation: spin 9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tick { animation: tick 1.50s ease-in-out infinite; }
    @keyframes tick { 0%, 70% { fill-opacity: .08; stroke-opacity: .3; } 82% { fill-opacity: .3; stroke-opacity: 1; } 100% { fill-opacity: .08; stroke-opacity: .3; } }
    .f1, .f2 { opacity: 0; animation: 6s ease-in-out infinite; }
    .f1 { animation-name: f1; }
    .f2 { animation-name: f2; }
    @keyframes f1 { 0%, 8% { opacity: 0; transform: translateY(-14px); } 14%, 70% { opacity: 1; transform: none; } 78%, 100% { opacity: 0; transform: translateX(26px); } }
    @keyframes f2 { 0%, 28% { opacity: 0; transform: translateY(-14px); } 34%, 50% { opacity: 1; transform: none; } 58%, 100% { opacity: 0; transform: translateX(26px); } }
    .logo { transform-origin: 81px 74px; animation: spin 4s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0a1426"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="22" fill="none" stroke="#dce7fa" stroke-opacity=".1"/>

  <!-- brand -->
  <circle cx="81" cy="74" r="14" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
  <g class="logo"><circle cx="95" cy="74" r="4" fill="#fbbf24"/></g>
  <text x="108" y="80" fill="#8ea3c8" font-size="15" font-weight="500" letter-spacing=".4">open-source · runs in your browser</text>
  <text x="62" y="162" font-size="58" font-weight="700" fill="#dce7fa" letter-spacing="-1">JS <tspan fill="url(#title)">Runtime</tspan> Lab</text>
  <text x="64" y="208" font-size="20" fill="#8ea3c8">Paste JavaScript, press Run, and watch the call stack,</text>
  <text x="64" y="236" font-size="20" fill="#8ea3c8">queues and event loop execute it, step by step.</text>
  
    <g transform="translate(64.0 300)">
      <rect width="149.4" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/>
      <circle cx="13" cy="14" r="3.2" fill="#22d3ee"/>
      <text x="22" y="18.5" fill="#dce7fa" font-size="12.5">Node.js event loop</text>
    </g>
    <g transform="translate(223.4 300)">
      <rect width="149.4" height="28" rx="14" fill="#60a5fa" fill-opacity=".1" stroke="#60a5fa" stroke-opacity=".45"/>
      <circle cx="13" cy="14" r="3.2" fill="#60a5fa"/>
      <text x="22" y="18.5" fill="#dce7fa" font-size="12.5">Browser event loop</text>
    </g>
    <g transform="translate(382.8 300)">
      <rect width="112.9" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/>
      <circle cx="13" cy="14" r="3.2" fill="#a78bfa"/>
      <text x="22" y="18.5" fill="#dce7fa" font-size="12.5">Step backward</text>
    </g>
    <g transform="translate(505.7 300)">
      <rect width="83.7" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
      <circle cx="13" cy="14" r="3.2" fill="#34d399"/>
      <text x="22" y="18.5" fill="#dce7fa" font-size="12.5">No server</text>
    </g>

  <!-- call stack -->
  <rect x="676" y="70" width="196" height="306" rx="12" fill="#0d1a31" fill-opacity=".85" stroke="#dce7fa" stroke-opacity=".12"/>
  <text x="692" y="96" fill="#8ea3c8" font-size="12.5" font-weight="500">Call stack</text>
  
    <g class="">
      <rect x="688" y="318" width="172" height="46" rx="7" fill="#11203b" stroke="#22d3ee" stroke-opacity=".55"/>
      <rect x="695" y="327" width="3" height="28" rx="1.5" fill="#22d3ee"/>
      <text x="707" y="338" class="mono" fill="#dce7fa" font-size="12.5">(main script)</text>
      <text x="707" y="354" fill="#64799f" font-size="10.5">module code</text>
    </g>
    <g class="f1">
      <rect x="688" y="264" width="172" height="46" rx="7" fill="#11203b" stroke="#a78bfa" stroke-opacity=".55"/>
      <rect x="695" y="273" width="3" height="28" rx="1.5" fill="#a78bfa"/>
      <text x="707" y="284" class="mono" fill="#dce7fa" font-size="12.5">async1()</text>
      <text x="707" y="300" fill="#64799f" font-size="10.5">async function</text>
    </g>
    <g class="f2">
      <rect x="688" y="210" width="172" height="46" rx="7" fill="#11203b" stroke="#34d399" stroke-opacity=".55"/>
      <rect x="695" y="219" width="3" height="28" rx="1.5" fill="#34d399"/>
      <text x="707" y="230" class="mono" fill="#dce7fa" font-size="12.5">console.log()</text>
      <text x="707" y="246" fill="#64799f" font-size="10.5">native</text>
    </g>

  <!-- event loop ring -->
  <circle cx="1052" cy="212" r="126" fill="#0d1a31" fill-opacity=".7"/>
  <path d="M 1056.89 100.11 A 112 112 0 0 1 1146.46 151.82" class="seg"/><path d="M 1151.35 160.28 A 112 112 0 0 1 1151.35 263.72" class="seg"/><path d="M 1146.46 272.18 A 112 112 0 0 1 1056.89 323.89" class="seg"/><path d="M 1047.11 323.89 A 112 112 0 0 1 957.54 272.18" class="seg"/><path d="M 952.65 263.72 A 112 112 0 0 1 952.65 160.28" class="seg"/><path d="M 957.54 151.82 A 112 112 0 0 1 1047.11 100.11" class="seg"/>
  <g class="spin-step"><path d="M 1059.81 100.27 A 112 112 0 0 1 1144.85 149.37" fill="none" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/></g>
  <g class="spin"><circle cx="1052" cy="100" r="9" fill="#22d3ee" opacity=".55" filter="url(#blur)"/><circle cx="1052" cy="100" r="4.5" fill="#ecfeff"/></g>
  <text x="1122.0" y="94.8" text-anchor="start" class="lbl">Timers</text><text x="1192.0" y="216.0" text-anchor="start" class="lbl">Pending</text><text x="1122.0" y="337.2" text-anchor="start" class="lbl">Idle, prepare</text><text x="982.0" y="337.2" text-anchor="end" class="lbl">Poll</text><text x="912.0" y="216.0" text-anchor="end" class="lbl">Check</text><text x="982.0" y="94.8" text-anchor="end" class="lbl">Close</text>
  <text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:0.00s">Timers</text><text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:1.50s">Pending</text><text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:3.00s">Idle, prepare</text><text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:4.50s">Poll</text><text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:6.00s">Check</text><text x="1052" y="206" text-anchor="middle" class="phase" style="animation-delay:7.50s">Close</text>
  <text x="1052" y="228" text-anchor="middle" fill="#64799f" font-size="11.5">loop iteration</text>
  <g transform="translate(976 242)">
    <rect class="tick" width="70" height="22" rx="11" fill="#e879f9" stroke="#e879f9"/>
    <text x="35" y="15" text-anchor="middle" fill="#dce7fa" font-size="11">nextTick</text>
    <rect class="tick" x="80" width="74" height="22" rx="11" fill="#a78bfa" stroke="#a78bfa"/>
    <text x="117" y="15" text-anchor="middle" fill="#dce7fa" font-size="11">microtasks</text>
  </g>
</svg>
